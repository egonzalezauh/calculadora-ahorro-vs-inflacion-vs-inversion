name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 6 * * *"   # todos los dias a las 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert + delete fila dummy en keepalive (actividad inequivoca de escritura)
        run: |
          set -e
          BASE_URL="${{ secrets.SUPABASE_URL }}/rest/v1/keepalive"
          HEADERS=(-H "apikey: ${{ secrets.SUPABASE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")

          response=$(curl -s -w "\n%{http_code}" -X POST "$BASE_URL" \
            "${HEADERS[@]}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Insert HTTP $code"
          if [ "$code" -ge 300 ]; then
            echo "$body"
            exit 1
          fi

          id=$(echo "$body" | jq -r '.[0].id')
          echo "Fila insertada id=$id"

          del_code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "$BASE_URL?id=eq.$id" "${HEADERS[@]}")
          echo "Delete HTTP $del_code"
          [ "$del_code" -lt 300 ] || exit 1
